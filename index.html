<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ən Uyğun Film</title>

  <!-- Şirin yuvarlaq şriftlər -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Arxa fon: neon parıltılar və üzən stikerlər -->
  <div class="fon-parilti" aria-hidden="true"></div>
  <div id="stikerler" aria-hidden="true"></div>

  <header>
    <h1 class="neon-yazi">🎬 Ən Uyğun Film</h1>
    <p class="alt-yazi">Əhvalını de, sənə uyğun filmi tapaq.</p>
  </header>

  <main>
    <section id="sual-bolmesi" class="panel">
      <!-- Irəliləyiş zolağı -->
      <div class="irelileyis">
        <div class="zolaq"><div id="zolaq-dolu"></div></div>
        <span id="novbe-yazi">1 / 6</span>
      </div>

      <h2 id="sual-basligi"></h2>
      <div id="variantlar"></div>
      <button id="geri-duymesi" class="ikinci-duyme">← Geri</button>
    </section>

    <section id="netice-bolmesi" class="panel gizli">
      <h2>Sənin üçün seçdiklərim 🍿</h2>
      <p class="netice-giris">Cavablarına görə ən uyğun filmlər:</p>
      <div id="filmler"></div>
      <button id="yeniden-duymesi" class="ikinci-duyme">🔄 Yenidən başla</button>
    </section>
  </main>

  <footer>
    <p>Şəbnəmin layihəsi · 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
